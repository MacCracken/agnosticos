name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. The version-verify
    # step below enforces the shape + match against VERSION file.
    # AGNOS uses CalVer (YYYY.M.D) which fits the same x.y.z shape.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v' so v1.3.0 == 1.3.0
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$' || {
            echo "tag ($TAG) is not x.y.z or x.y.z-N shape"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG"

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -oP '(?<=^cyrius = ")[^"]+' scripts/cyrius.cyml)}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/bin" "$HOME/.cyrius/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/bin/"* 2>/dev/null || true
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV
          rm -f cyrius-*.tar.gz

      - name: Resolve deps
        working-directory: scripts
        run: cyrius deps

      - name: Build boot pipeline
        working-directory: scripts
        run: |
          mkdir -p build
          cyrius build src/boot.cyr build/boot
          echo "boot: $(wc -c < build/boot) bytes"

      - name: Test
        working-directory: scripts
        run: cyrius test tests/boot.tcyr

      - name: Stage release artifacts
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          STAGE=$(mktemp -d)
          # Source tarball — genesis repo, no generated content.
          git archive --format=tar.gz \
            --prefix="agnosticos-${TAG}/" \
            -o "${STAGE}/agnosticos-${TAG}-src.tar.gz" HEAD
          # Prebuilt boot pipeline binary (x86_64 Linux).
          cp scripts/build/boot "${STAGE}/agnosticos-boot-${TAG}-x86_64-linux"
          (cd "${STAGE}" && sha256sum \
            "agnosticos-${TAG}-src.tar.gz" \
            "agnosticos-boot-${TAG}-x86_64-linux" > SHA256SUMS)
          mv "${STAGE}"/* .
          ls -la agnosticos-*

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            agnosticos-*-src.tar.gz
            agnosticos-boot-*-x86_64-linux
            SHA256SUMS

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Extract changelog section
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          if [ ! -s /tmp/body.md ]; then
            echo "No CHANGELOG section for [${TAG}] — releasing with empty body" >&2
            echo "See CHANGELOG.md for the full history." > /tmp/body.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: "AGNOS ${{ github.ref_name }}"
          body_path: /tmp/body.md
          # Pre-Beta: all releases are prereleases until AGNOS ships Beta.
          prerelease: true
          files: |
            agnosticos-*-src.tar.gz
            agnosticos-boot-*-x86_64-linux
            SHA256SUMS
